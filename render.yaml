services:
  - type: web
    name: safemate-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRELOAD_MODELS_ON_STARTUP
        value: "false"
      - key: MODEL_ID
        value: umm-maybe/AI-image-detector
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://safemate-versionfinal.vercel.app,https://safemate-frontend.vercel.app,http://localhost:5173
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_IMAGE_PIXELS
        value: "16000000"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /api/v1/health
